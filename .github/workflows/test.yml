name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      # lupa 在 macOS arm64 上没有 LuaJIT，那里允许跳过；其他平台缺 VM 直接算失败
      LUARECOMP_REQUIRE_ALL: ${{ matrix.os == 'macos-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装
        run: python -m pip install .
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 命令行入口
        run: luarecomp --help

  slow:
    name: 完整语料（LUARECOMP_SLOW=1）
    runs-on: ubuntu-latest
    env:
      LUARECOMP_SLOW: "1"
      LUARECOMP_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
